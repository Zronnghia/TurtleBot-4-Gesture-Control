# Localization (AMCL + map_server) – cấu hình cho Bài thực hành 04.
#
# Dựa trên turtlebot4_navigation 1.0.5 (ROS 2 Humble): config/localization.yaml.
# THAY ĐỔI so với bản gốc: (1) bật set_initial_pose để AMCL tự khởi tạo vị trí robot = gốc toạ
# độ của bản đồ; (2) AMCL đọc /scan_nav (= /scan trễ 0.1 s) thay vì scan.
#
# Vì sao (0, 0, 0) là đúng?
#   SLAM Toolbox đặt frame "map" trùng với frame "odom" tại thời điểm bắt đầu
#   mapping, tức là đúng tại vị trí robot được spawn (đang nằm trong dock).
#   Nếu ở Phần 3 bạn spawn lại robot ở CÙNG vị trí/hướng như lúc mapping
#   (mặc định x=0, y=0, yaw=0) thì robot đang ở (0, 0, 0) trong frame "map".
#   Nếu spawn ở chỗ khác, hoặc AMCL lệch, chỉ cần dùng "2D Pose Estimate"
#   trên RViz2 để đặt lại – thao tác đó luôn ghi đè giá trị này.
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # tb4_lab04: /scan_nav = /scan trễ 0.1 s (xem navigation.launch.py)
    scan_topic: /scan_nav
    # --- Thêm cho bài lab: tự đặt initial pose (xem giải thích ở đầu file) ---
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: True
    # Được ghi đè bởi tham số launch "map" (navigation.launch.py tự điền).
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
